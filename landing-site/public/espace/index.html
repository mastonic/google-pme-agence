<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Locale PME Espace Client</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout : barre latérale sombre + colonne de travail claire, cartes blanches sur fond ardoise pâle (charte Pulse Locale PME, thème clair assumé) */
:root{
  --brand:#00A896; --brand-600:#029484; --brand-700:#028090; --brand-900:#05445E;
  --brand-50:#E6F7F5; --brand-100:#C2ECE6; --brand-200:#8FDCD1;
  --ink:#1E293B; --ink-soft:#475569; --muted:#64748B; --faint:#94A3B8;
  --gold:#C9A24B;
  --surface:#F5F8FA; --card:#FFFFFF; --line:#E2E8F0; --line-soft:#EEF2F5;
  --ok:#047857; --ok-bg:#ECFDF5; --ok-ring:#A7F3D0;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-ring:#FDE68A;
  --bad:#B91C1C; --bad-bg:#FEF2F2; --bad-ring:#FECACA;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Montserrat","Inter",ui-sans-serif,system-ui,sans-serif;
  --shadow:0 1px 2px rgb(15 23 42/.04),0 4px 16px -4px rgb(15 23 42/.07);
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;display:block}
.ic-sm{width:14px;height:14px}
.ic-lg{width:20px;height:20px}
.ic-xl{width:26px;height:26px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--ink-soft)}

/* ---------- Bandeau démo ---------- */
.demo{background:var(--brand-50);border-bottom:1px solid var(--brand-100);color:var(--brand-900);font-size:13px}
.demo-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:8px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.demo-tag{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.demo-tag span{font-weight:400;color:var(--brand-700)}
.demo label{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.demo select{height:32px;border:1px solid var(--brand-200);border-radius:8px;background:#fff;padding:0 8px;max-width:100%;min-width:0}

/* ---------- Shell ---------- */
.shell{min-height:100dvh}
.side{display:none}
.mhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgb(255 255 255/.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.main{width:100%;max-width:1152px;margin:0 auto;padding-block:24px 40px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.has-bottom .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:11px;font-weight:500;color:var(--ink-soft);text-decoration:none}
.bnav a .ic{width:20px;height:20px}
.bnav a.on{color:var(--brand-600)}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo .p1{color:var(--ink)} .logo.inv .p1{color:#fff} .logo .p2{color:var(--brand)}
.logo .p3{display:inline-block;padding:1px 5px;border-radius:5px;background:var(--ink);color:#fff;font-size:10px;letter-spacing:.06em;vertical-align:2px} .logo.inv .p3{background:#fff;color:var(--ink)}
.logo svg{width:40px;height:32px;flex:none}
@media (min-width:640px){
  .main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:260px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;align-self:start;position:sticky;top:0;height:100dvh;background:var(--ink);color:#CBD5E1;padding-block:24px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .mhead,.bnav{display:none}
  .main{padding-block:40px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}
  .has-bottom .main{padding-bottom:40px}
}
.side-sub{margin:4px 0 0;padding:0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#64748B}
.side .logo{padding:0 8px}
.snav{display:flex;flex-direction:column;gap:4px;margin-top:32px}
.snav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-weight:500;text-decoration:none;color:#CBD5E1;transition:background .15s,color .15s}
.snav a:hover{background:rgb(255 255 255/.05);color:#fff}
.snav a.on{background:rgb(255 255 255/.1);color:#fff}
.acct{margin-top:auto;background:rgb(255 255 255/.05);border-radius:12px;padding:12px}
.acct p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .an{font-weight:600;color:#fff}
.acct .ae{font-size:12px;color:#94A3B8}
.acct .out{margin-top:12px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:12px;color:#94A3B8;cursor:pointer}
.acct .out:hover{color:#fff}

/* ---------- Page ---------- */
.ph{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.ph h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--ink-soft)}
.ph-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (min-width:640px){.ph{flex-direction:row;align-items:flex-end;justify-content:space-between}.ph h1{font-size:30px}}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-sm{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;gap:24px;align-items:start}
@media (min-width:1280px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2b{display:grid;gap:24px}
@media (min-width:1024px){.grid2b{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid-sup{display:grid;gap:24px;align-items:start}
@media (min-width:1024px){.grid-sup{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

/* ---------- Cartes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-direction:column;gap:4px;padding:20px 20px 12px}
.card-c{padding:0 20px 20px}
@media (min-width:640px){.card-h{padding:24px 24px 12px}.card-c{padding:0 24px 24px}.card-h.row{flex-direction:row;justify-content:space-between;align-items:flex-start;gap:16px}}
.card-h.row{gap:16px}
.card-t{margin:0;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.card-d{margin:0;color:var(--ink-soft)}
.rowsb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,color .15s,opacity .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgb(0 0 0/.06)}
.btn-primary:hover:not(:disabled){background:var(--brand-600)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover:not(:disabled){background:#2c3a50}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover:not(:disabled){background:var(--surface)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-ghost:hover:not(:disabled){background:var(--brand-50);color:var(--brand-700)}
.btn-sm{height:32px;padding:0 12px;font-size:12px}
.btn-lg{height:48px;padding:0 24px;font-size:15px}
.btn-icon{width:36px;height:36px;padding:0}
.btn-block{width:100%}

/* ---------- Formulaires ---------- */
.fgrid{display:grid;gap:16px}
@media (min-width:640px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:500}
.input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgb(0 168 150/.15)}
.input:disabled{background:var(--surface)}
.input[aria-invalid="true"]{border-color:#EF4444}
textarea.input{height:auto;min-height:96px;padding:8px 12px;line-height:1.55;resize:vertical}
select.input{padding-right:8px}
.with-ic{position:relative}
.with-ic>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.with-ic .input{padding-left:36px}
.hint{margin:0;font-size:12px;color:var(--ink-soft)}
.err{margin:0;font-size:12px;color:var(--bad)}
.hours{border:1px solid var(--line);border-radius:8px;padding:8px 16px 12px;margin:0;min-width:0}
.hours legend{display:flex;align-items:center;gap:8px;padding:0 4px;font-weight:500}
.hours legend .ic{color:var(--brand-600)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line-soft)}
.hrow:first-of-type{border-top:0}
.hday{width:84px;font-weight:500;text-transform:capitalize}
.hclosed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.hclosed input,.chk input{accent-color:var(--brand)}
.htimes{margin-left:auto;display:flex;align-items:center;gap:8px}
.hrow.off .htimes{visibility:hidden}
.input.time{width:112px;height:36px;padding:0 8px;font-variant-numeric:tabular-nums}
.ffoot{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.dirty{font-size:12px;color:var(--warn)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.chk:hover{border-color:var(--brand-200)}
.chk.on{border-color:var(--brand);background:var(--brand-50)}
.chk.dis{opacity:.6;cursor:not-allowed}
.chk input{width:16px;height:16px;margin:2px 0 0;flex:none}

/* ---------- Badges & états vides ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#F1F5F9;color:var(--ink-soft);box-shadow:inset 0 0 0 1px #E2E8F0}
.badge.brand{background:var(--brand-50);color:var(--brand-700);box-shadow:inset 0 0 0 1px var(--brand-200)}
.badge.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-ring)}
.badge.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-ring)}
.badge.bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-ring)}
.badge .live{width:7px;height:7px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgb(16 185 129/.2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:#fff;padding:40px 24px}
.empty .eic{width:40px;height:40px;border-radius:50%;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center}
.empty .et{margin:0;font-weight:600}
.empty .ed{margin:0;max-width:26rem;color:var(--ink-soft)}

/* ---------- Stepper ---------- */
.stepper{padding:20px}
@media (min-width:640px){.stepper{padding:24px}}
.st-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px;font-weight:600}
.st-head b{color:var(--brand-600)}
.steps{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.track{position:absolute;left:12.5%;right:12.5%;top:18px;height:4px;border-radius:4px;background:#F1F5F9}
.track i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .7s ease}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid #E2E8F0;background:#fff;color:var(--faint)}
.step.done .dot{background:#10B981;border-color:#10B981;color:#fff}
.step.cur .dot{border-color:var(--brand);color:var(--brand-600);box-shadow:0 0 0 4px rgb(0 168 150/.15)}
.step.cur .dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgb(0 168 150/.4);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(1.6);opacity:0}}
.sl{margin-top:8px;font-size:12px;font-weight:600;line-height:1.25}
.step.todo .sl{color:var(--faint)}
.sh{display:none;margin-top:2px;font-size:12px;color:var(--ink-soft)}
@media (min-width:640px){.sl{font-size:14px}.sh{display:block}}

/* ---------- Médias ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-radius:8px;padding:4px}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:6px;padding:6px 12px;font-weight:500;color:var(--ink-soft);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(15 23 42/.08)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:28px 20px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--brand-200);background:var(--surface)}
.drop.over{border-color:var(--brand);background:var(--brand-50)}
.drop.full{opacity:.5;cursor:not-allowed}
.drop .ic{width:32px;height:32px;color:var(--faint)}
.drop.over .ic{color:var(--brand-600)}
.drop .dt{margin:0;font-weight:600}
.drop .dd{margin:0;font-size:12px;color:var(--ink-soft)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
@media (min-width:640px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.thumb{position:relative;aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.logo img{object-fit:contain;padding:10px}
.thumb.pending img{opacity:.45}
.thumb .ov{position:absolute;inset:0;display:grid;place-items:center;color:var(--brand-600)}
.thumb .meta{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 4px;background:linear-gradient(transparent,rgb(0 0 0/.6));color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:6px;border:0;background:rgb(255 255 255/.94);color:var(--bad);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgb(0 0 0/.15)}
@media (hover:hover){.thumb .del,.thumb .meta{opacity:0;transition:opacity .15s}.thumb:hover .del,.thumb:hover .meta,.thumb .del:focus-visible{opacity:1}}
.none{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;padding:6px 0;color:var(--ink-soft)}

/* ---------- Aperçu ---------- */
.seg{display:flex;background:var(--surface);border-radius:8px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(15 23 42/.08)}
.seg.ico button{width:32px;height:32px;padding:0;justify-content:center}
.seg.ico button.on{color:var(--brand-600)}
.pv-tools{display:flex;align-items:center;gap:4px}
@media (max-width:639px){.hide-sm{display:none!important}}
.pv-stage{display:flex;justify-content:center;background:#EAF0F3;border-radius:12px;padding:12px}
@media (min-width:640px){.pv-stage{padding:16px}}
.pv-desk{width:100%;max-width:100%;aspect-ratio:16/10;display:flex;flex-direction:column;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 12px 32px -12px rgb(15 23 42/.35)}
.pv-bar{height:28px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.pv-bar i{width:10px;height:10px;border-radius:50%;background:#FCA5A5}
.pv-bar i:nth-child(2){background:#FCD34D}.pv-bar i:nth-child(3){background:#6EE7B7}
.pv-bar span{margin-left:12px;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-desk iframe{flex:1;width:100%;border:0;display:block}
.pv-phone{width:320px;max-width:100%;aspect-ratio:9/19;border:10px solid var(--ink);border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 12px 32px -12px rgb(15 23 42/.35)}
.pv-phone iframe{width:100%;height:100%;border:0;display:block}

/* ---------- Validation ---------- */
.plans{display:grid;gap:12px}
@media (min-width:768px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan{position:relative;display:flex;flex-direction:column;text-align:left;border:2px solid var(--line);border-radius:12px;padding:16px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.plan:hover:not(:disabled){border-color:var(--brand-200)}
.plan.on{border-color:var(--brand);background:#F0FAF8}
.plan:disabled{cursor:not-allowed}
.plan .pop{position:absolute;top:-10px;right:12px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.plan .pn{font-family:var(--font-display);font-weight:700}
.plan .pp{margin-top:4px;font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.plan .pp small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--ink-soft)}
.plan .pt{margin-top:2px;font-size:12px;color:var(--ink-soft)}
.plan ul,.feats{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plan li,.feats li{display:flex;align-items:flex-start;gap:6px;font-size:12px}
.plan li .ic,.feats li .ic{margin-top:2px;width:14px;height:14px;color:var(--brand-600)}
.vfoot{display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.vfoot{flex-direction:row;align-items:center;justify-content:space-between}.vfoot .btn{width:auto}}
.secure{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;color:var(--ink-soft)}
.secure .ic{color:var(--brand-600)}

/* ---------- Performance ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1024px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.kpi{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
@media (min-width:640px){.kpi{padding:20px}}
.kpi.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-700) 60%,var(--brand-900) 100%);border-color:transparent;color:#fff}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}

.kpi.hero .kpi-ic{background:rgb(255 255 255/.15);color:#fff}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.delta .ic{width:12px;height:12px}

.delta.down{background:var(--bad-bg);color:var(--bad)}

.cta .btn{align-self:flex-start}
.tiles{display:grid;gap:8px;list-style:none;margin:0;padding:0}

.tiles li{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:8px;padding:10px 12px}
.tiles .ic{color:var(--brand-600)}
.subsec{border-top:1px solid var(--line-soft);padding-top:16px}
.subsec h3{margin:0;font-size:13px;font-weight:600}

.bar{height:6px;flex:1 1 120px;max-width:200px;border-radius:6px;background:#E2E8F0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}

.hist .hd{margin:0;font-size:12px;color:var(--faint)}

.hist li.fresh{animation:fresh 1.2s ease-out}

.login{display:grid;min-height:calc(100dvh - 49px)}

.lside{display:none}

.lmain{display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.lbox{width:100%;max-width:384px}
.lbox h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:24px}
.lbox .ls{margin:4px 0 0;color:var(--ink-soft)}
.lbox form{margin-top:32px}
.mobile-logo{margin-bottom:40px}

.sent .ic{color:var(--brand-600)}
.sent p{margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-700);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(calc(100vw - 32px),420px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px -10px rgb(15 23 42/.3);animation:tin .25s ease-out}

.chip button{border:0;background:transparent;cursor:pointer;color:var(--brand-700);display:inline-flex;padding:3px;border-radius:999px}

.subt{margin:4px 0 8px;font:600 14px/1.3 var(--font-body);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const SESSION_KEY = "pp_session";

const getSession = () => { try { return store().getItem(SESSION_KEY) || ""; } catch { return ""; } };

class ApiError extends Error { constructor(status, detail) { super(typeof detail === "string" ? detail : (detail?.message || "Une erreur est survenue.")); this.status = status; this.detail = detail; } }
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" }, session = getSession();
  if (session) headers["X-Client-Session"] = session;
  let res;
  try { res = await fetch(path, { method: opts.method || "GET", headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body) }); }
  catch { throw new ApiError(0, "Connexion impossible. Vérifie ta connexion internet."); }
  let data = null; try { data = await res.json(); } catch {}
  if (res.status === 401 && path.startsWith("/client/space")) { setSession(""); S.loaded = false; go("connexion"); }
  if (!res.ok) throw new ApiError(res.status, data?.detail ?? "Une erreur est survenue.");
  return data;
}

function kpis() {
  const n = new Date(), ms = new Date(n.getFullYear(), n.getMonth(), 1), ps = new Date(n.getFullYear(), n.getMonth() - 1, 1);
  const lastPrev = new Date(n.getFullYear(), n.getMonth(), 0).getDate();
  const pe = new Date(n.getFullYear(), n.getMonth() - 1, Math.min(n.getDate(), lastPrev));
  const sum = (a, b) => S.daily.filter(d => d.date >= a && d.date <= b).reduce((o, d) => ({ v:o.v + d.v, c:o.c + d.c, w:o.w + d.w, d:o.d + d.d, f:o.f + (d.f || 0) }), { v:0, c:0, w:0, d:0, f:0 });
  return { cur:sum(ms, n), prev:sum(ps, pe) };
}

function toast(msg, type = "success") {
  const box = $("#toasts"), el = document.createElement("div");
  const icn = { success:"check", error:"alert", warn:"alert", info:"info" }[type];
  el.className = `toast ${type}`; el.setAttribute("role", type === "error" ? "alert" : "status");
  el.innerHTML = `${ic(icn)}<span>${esc(msg)}</span>`;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, 4200);
}

/* ================= Graphique ================= */
function nice(v) { if (v <= 1) return 1; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p); }
function mono(pts) {
  const n = pts.length; if (n < 2) return "";
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; } const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b; if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; } }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3; d += ` C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + h * t[i]).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - h * t[i + 1]).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`; }
  return d;
}
function drawChart() {
  const box = $("#chart"); if (!box) return;
  const M = METRICS.find(m => m.k === S.metric), ser = series(), n = ser.length;
  const W = Math.max(260, box.clientWidth), H = W < 560 ? 220 : 280, P = { l:38, r:14, t:14, b:28 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b, step = nice(Math.max(1, ...ser.map(s => s.val)) / 4), top = step * 4;
  const X = i => P.l + i * iw / (n - 1), Y = v => P.t + ih * (1 - v / top);
  const pts = ser.map((s, i) => [X(i), Y(s.val)]), line = mono(pts);
  let grid = "";
  for (let j = 0; j <= 4; j++) { const y = Y(step * j).toFixed(1); grid += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#E2E8F0" ${j ? 'stroke-dasharray="3 3"' : ""}/><text x="${P.l - 8}" y="${y}" text-anchor="end" dominant-baseline="middle">${fmtN(step * j)}</text>`; }
  const k = Math.ceil(n / Math.max(2, Math.floor(iw / 74)));
  let xl = "";
  for (let i = n - 1; i >= 0; i -= k) { const x = X(i); if (i !== n - 1 && x < P.l + 22) continue; xl += `<text x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${i === n - 1 ? "end" : "middle"}">${fmtD(ser[i].date)}</text>`; }
  const last = pts[n - 1], total = ser.reduce((s, d) => s + d.val, 0);
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${M.l} par jour sur ${S.range} jours, total ${fmtN(total)}">
   <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${M.c}" stop-opacity=".28"/><stop offset="1" stop-color="${M.c}" stop-opacity="0"/></linearGradient></defs>
   ${grid}${xl}
   <path d="${line} L${X(n - 1).toFixed(1)},${P.t + ih} L${P.l},${P.t + ih} Z" fill="url(#cg)"/>
   <path d="${line}" fill="none" stroke="${M.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

   <rect class="hit" x="${P.l}" y="0" width="${iw}" height="${H - P.b}" fill="transparent"/></svg><div class="tip" hidden></div>`;

const ROUTES = ["connexion", "projet", "performance", "receptionniste", "modifications", "abonnement"], LIVE = ["performance", "receptionniste", "modifications", "abonnement"];

}

  $("#app").innerHTML = r === "connexion" ? loginView() : shell(r, views[r]());
  if (r === "projet") refreshPreview();
  if (r === "performance") drawChart();
  if (r === "receptionniste") rcAfterRender();
  if (changed) window.scrollTo(0, 0);
}

/* ================= Actions ================= */
function validate() {
  const v = S.info, e = {};
  if (v.business_name.trim().length < 2) e.business_name = "Nom trop court (2 caractères minimum)";
  if (!PHONE.test(v.phone.trim())) e.phone = "Numéro français invalide (ex. 06 12 34 56 78)";
  if (v.whatsapp.trim() && !PHONE.test(v.whatsapp.trim())) e.whatsapp = "Numéro français invalide (ex. 06 12 34 56 78)";
  if (v.address.trim().length < 5) e.address = "Adresse incomplète";
  if (v.maps.trim() && !/^https?:\/\/\S+$/.test(v.maps.trim())) e.maps = "Lien invalide, il doit commencer par https://";
  if (v.description.trim().length < 20) e.description = "Ajoute quelques mots (20 caractères minimum)";
  if (!S.hours.every(h => h.closed || h.open < h.close)) e.hours = "L'heure de fermeture doit être après l'heure d'ouverture";
  return e;
}
function setDirty() { S.dirty = true; const b = $("#save-btn"), d = $("#dirty"); if (b) b.disabled = false; if (d) d.hidden = false; }
async function saveInfo() {
  const e = validate(); S.errors = e;
  if (Object.keys(e).length) {
    replace("info-card", infoCard());
    toast("Certains champs sont à corriger.", "error");
    const first = Object.keys(e)[0]; (first === "hours" ? $("#e-hours") : $("#f-" + first))?.focus?.();
    return;
  }
  const b = $("#save-btn"); b.disabled = true; b.innerHTML = `${ic("loader", "spin")} Enregistrement…`;
  try {
    const st = await api("/client/space/info", { method:"PUT", body:{ info:S.info, hours:S.hours, services:S.services, social:S.social } });
    const prevStep = S.step, keep = { wz:S.wz, wizardDone:S.wizardDone }; applyState(st); Object.assign(S, keep); S.infoOk = false;
    if (S.step !== prevStep) render(); else { replace("info-card", infoCard()); replace("val-card", valCard()); refreshPreview(); }
    toast("Informations enregistrées.");
  } catch (err) {
    S.errors = err.detail?.errors || {};
    replace("info-card", infoCard());
    toast(err.message, "error");
  }
}
function readAsDataURL(f) { return new Promise((ok, ko) => { const rd = new FileReader(); rd.onload = () => ok(rd.result); rd.onerror = ko; rd.readAsDataURL(f); }); }
function addFiles(files) {
  const k = S.mediaTab, def = KINDS[k], ok = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"], acc = [];
  for (const f of files) {
    if (!ok.includes(f.type)) { toast(`« ${f.name} » refusé : format non pris en charge (PNG, JPG, WebP ou SVG).`, "error"); continue; }
    if (f.size > 10 * 1048576) { toast(`« ${f.name} » refusé : 10 Mo maximum.`, "error"); continue; }
    acc.push(f);
  }
  const slots = k === "logo" ? 1 : Math.max(0, def.max - S.media[k].length - S.pending.filter(p => p.kind === k).length);
  if (acc.length > slots) toast(`Maximum ${def.max} fichier(s) pour « ${def.label} ».`, "warn");
  acc.slice(0, slots).forEach(async f => {
    const id = uid();
    try {
      const data = await readAsDataURL(f);
      S.pending.push({ id, kind:k, src:data }); replace("media-card", mediaCard());
      const m = await api("/client/space/media", { method:"POST", body:{ kind:k, name:f.name, data } });
      S.pending = S.pending.filter(p => p.id !== id);
      if (k === "logo") S.media.logo = [];
      S.media[k].push({ id:m.id, name:m.name, size:m.size, src:m.src });
      if (m.step !== S.step) { S.step = m.step; render(); } else replace("media-card", mediaCard());
      toast(`« ${f.name} » ajouté.`);
    } catch (err) {
      S.pending = S.pending.filter(p => p.id !== id); replace("media-card", mediaCard());
      toast(err instanceof ApiError ? err.message : `« ${f.name} » : lecture impossible.`, "error");
    }
  });
}
async function delMedia(id) {
  S.deleting = id; replace("media-card", mediaCard());
  try {
    await api(`/client/space/media/${encodeURIComponent(id)}`, { method:"DELETE" });
    for (const k in S.media) S.media[k] = S.media[k].filter(m => m.id !== id);
    toast("Fichier supprimé.");
  } catch (err) { toast(err.message, "error"); }
  S.deleting = null; replace("media-card", mediaCard());
}
async function checkout() {
  if (!(S.step === 2 && S.infoOk && S.designOk && S.paymentReady)) return;
  const p = PLANS[S.plan], token = ++S.payToken;
  openModal(`<div class="pay"><div class="pay-ic">${ic("shield", "ic-xl")}</div><h2>Redirection vers le paiement sécurisé</h2><p class="muted">Forfait ${p.name} · ${S.billing === "annual" ? `${fmtN(p.annual)} € HT / an (2 mois offerts)` : `${p.price} € HT / mois`}</p><div class="pay-spin">${ic("loader", "ic-xl spin")}</div><button class="btn btn-ghost" data-act="close-modal">Annuler</button></div>`);
  try {
    const { url } = await api("/client/space/checkout", { method:"POST", body:{ plan:S.plan, billing:S.billing } });
    if (token === S.payToken) location.href = url;
  } catch (err) { if (token === S.payToken) { closeModal(); toast(err.message, "error"); } }
}
async function openPortal(t) {
  t.disabled = true;
  try { const { url } = await api("/client/space/portal", { method:"POST" }); location.href = url; }
  catch (err) { toast(err.message, "error"); t.disabled = false; }
}
function openSite() {
  if (S.status === "live" && S.siteUrl) { window.open(S.siteUrl, "_blank", "noopener"); return; }
  openModal(`<div class="mw-h"><span class="mw-t">${ic("external")} ${esc(siteHost())} · aperçu</span><button class="btn btn-ghost btn-icon" data-act="close-modal" aria-label="Fermer">${ic("x")}</button></div><iframe class="site-frame" title="Site de ${esc(S.saved.business_name)}"></iframe>`, true);
  refreshPreview();
}
async function logout() {
  try { await api("/client/auth/logout", { method:"POST" }); } catch {}
  setSession(""); S.loaded = false; S.linkSent = false; go("connexion");
}

const ACTS = {
  logout,
  tab:t => { S.mediaTab = t.dataset.k; replace("media-card", mediaCard()); },
  pick:t => { if (!t.classList.contains("full")) $("#file-in").click(); },
  "del-media":t => delMedia(t.dataset.id),
  device:t => { S.device = t.dataset.d; replace("preview-card", previewCard()); refreshPreview(); },
  "pv-refresh":() => { refreshPreview(); toast("Aperçu rechargé.", "info"); },
  "view-site":openSite,
  plan:t => { S.plan = t.dataset.p; replace("val-card", valCard()); $(`[data-p="${S.plan}"]`)?.focus(); },
  billing:t => { S.billing = t.dataset.b; replace("val-card", valCard()); $(`[data-b="${S.billing}"]`)?.focus(); },
  checkout, "close-modal":closeModal,
  metric:t => { S.metric = t.dataset.m; replace("chart-card", chartCard()); drawChart(); },
  range:t => { S.range = +t.dataset.r; replace("chart-card", chartCard()); drawChart(); },
  portal:openPortal,
  "login-reset":() => { S.linkSent = false; render(); $("#l-email")?.focus(); },
  "wz-next":wzNext,
  "wz-prev":() => wzGo(S.wz - 1),
  "wz-skip":() => wzGo(S.wz + 1),
  "wz-open":() => wzGo(1),
  "svc-add":addService,
  "svc-del":t => { S.services.splice(+t.dataset.i, 1); render(); },
  "rc-activate":rcActivate,
  "rc-wz-next":rcWzNext,
  "rc-wz-prev":() => { S.rcWz = Math.max(0, S.rcWz - 1); render(); window.scrollTo(0, 0); },
  "rc-wz-finish":rcFinish,
  "rc-restart":() => { S.rc.onboarded = false; S.rcWz = 0; render(); },
  "rc-voice":t => { S.rcDraft.voice = t.dataset.v; t.parentElement.querySelectorAll("button").forEach(b => { const on = b === t; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); }); },
  "rc-copy":t => { navigator.clipboard?.writeText(t.dataset.v).then(() => toast("Code copié.", "info")).catch(() => {}); },
  "rc-chat-reset":() => rcChatStart()
};

document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && !t.disabled && ACTS[t.dataset.act]) { if (t.tagName === "BUTTON" || t.dataset.act === "pick" || t.classList.contains("ovl")) e.preventDefault(); ACTS[t.dataset.act](t); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  const d = e.target.closest?.(".drop"); if (d && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACTS.pick(d); }
  if (e.target.id === "svc-in" && e.key === "Enter") { e.preventDefault(); addService(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.rc) { rcInputEvent(t); return; }
  if (t.dataset.field) {
    const k = t.dataset.field; S.info[k] = t.value; setDirty();
    if (S.errors[k]) { delete S.errors[k]; t.removeAttribute("aria-invalid"); $("#e-" + k).hidden = true; const h = $("#h-" + k); if (h) h.hidden = false; }
    if (k === "description") $("#h-description").textContent = `${t.value.length}/400, 2 ou 3 phrases sur ce qui te rend unique`;
  } else if (t.dataset.social) {
    S.social[t.dataset.social] = t.value;
    const er = $("#e-social_" + t.dataset.social); if (er && !er.hidden) { er.hidden = true; t.removeAttribute("aria-invalid"); delete S.errors["social_" + t.dataset.social]; }
  } else if (t.dataset.hour && t.type === "time") {
    S.hours[+t.dataset.hour][t.dataset.k] = t.value; setDirty();
  } else if (t.id === "s-msg") {
    $("#h-msg").textContent = `${t.value.length}/1500`; $("#s-send").disabled = t.value.trim().length < 10;
    if (!$("#e-msg").hidden) { $("#e-msg").hidden = true; t.removeAttribute("aria-invalid"); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (rcInputEvent(t)) return;
  if (t.id === "file-in") { addFiles([...t.files]); t.value = ""; }
  else if (t.dataset.hour && t.dataset.k === "closed") { const i = +t.dataset.hour; S.hours[i].closed = t.checked; t.closest(".hrow").classList.toggle("off", t.checked); setDirty(); }
  else if (t.dataset.check) { S[t.dataset.check] = t.checked; const id = t.id; replace("val-card", valCard()); $("#" + id)?.focus(); }
  else if (t.id === "s-cat") { S.cat = t.value; $("#s-msg").placeholder = CATS[S.cat].ph; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "info-form") saveInfo();
  else if (f.id === "rc-chat-form") { const m = $("#rc-msg").value.trim(); if (m && !S.rcChat.busy) { if (!S.rcChat.started) { rcChatStart().then(() => rcChatSend(m)); } else rcChatSend(m); } }
  else if (f.id === "rc-settings-form") {
    const b = $("#rc-save"); b.disabled = true; b.innerHTML = `${ic("loader", "spin")} Enregistrement…`;
    rcSave().then(ok => { if (ok) { render(); toast("Réglages enregistrés : ils s'appliquent dès le prochain appel."); } else { b.disabled = false; b.innerHTML = `${ic("save")} Enregistrer les réglages`; } });
  }
  else if (f.id === "ticket-form") saveTicket();
  else if (f.id === "sup-form") {
    const ta = $("#s-msg"), msg = ta.value.trim();
    if (msg.length < 10) { const er = $("#e-msg"); er.textContent = "Décris ta demande en quelques mots (10 caractères minimum)."; er.hidden = false; ta.setAttribute("aria-invalid", "true"); ta.focus(); return; }
    const b = $("#s-send"); b.disabled = true; b.innerHTML = `${ic("loader", "spin")} Envoi…`;
    api("/client/space/requests", { method:"POST", body:{ cat:S.cat, msg } }).then(created => {
      const r = { ...created, date:new Date(created.date) }; S.requests.unshift(r);
      ta.value = ""; $("#h-msg").textContent = "0/1500"; b.innerHTML = `${ic("send")} Envoyer la demande`;
      replace("hist-card", histCard(r.id)); replace("quota", quotaHTML());
      toast("Demande envoyée. L'équipe revient vers toi sous 48 h ouvrées.");
    }).catch(err => { b.disabled = false; b.innerHTML = `${ic("send")} Envoyer la demande`; toast(err.message, "error"); });
  } else if (f.id === "login-form") {
    const inp = $("#l-email"), v = inp.value.trim(), er = $("#e-email");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { er.textContent = "Saisis une adresse e-mail valide, par exemple toi@commerce.fr."; er.hidden = false; inp.setAttribute("aria-invalid", "true"); inp.focus(); return; }
    const b = $("#l-btn"); b.disabled = true; b.innerHTML = `${ic("loader", "spin")} Envoi du lien…`;
    api("/client/auth/request", { method:"POST", body:{ email:v } })
      .then(() => { S.email = v; S.linkSent = true; render(); })
      .catch(err => { b.disabled = false; b.textContent = "Recevoir mon lien de connexion"; toast(err.message, "error"); });
  }
});
document.addEventListener("dragover", e => { e.preventDefault(); const d = e.target.closest?.(".drop"); document.querySelectorAll(".drop.over").forEach(x => x !== d && x.classList.remove("over")); if (d && !d.classList.contains("full")) d.classList.add("over"); });
document.addEventListener("dragleave", e => { const d = e.target.closest?.(".drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", e => { e.preventDefault(); const d = e.target.closest?.(".drop"); document.querySelectorAll(".drop.over").forEach(x => x.classList.remove("over")); if (d && !d.classList.contains("full") && e.dataTransfer?.files?.length) addFiles([...e.dataTransfer.files]); });

let lastNarrow = innerWidth < 640, rT;
addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => {
  if (S.route === "performance") drawChart();
  const nw = innerWidth < 640; if (nw !== lastNarrow && S.route === "projet" && $("#preview-card")) { replace("preview-card", previewCard()); refreshPreview(); } lastNarrow = nw;
}, 120); });
addEventListener("hashchange", render);

/* ================= Démarrage ================= */
async function boot() {
  const q = new URLSearchParams(location.search), link = q.get("login") || q.get("t"), paid = q.get("payment") === "success";
  if (link || paid) history.replaceState(null, "", location.pathname + location.hash);
  if (link) {
    try { const { session } = await api("/client/auth/exchange", { method:"POST", body:{ token:link } }); setSession(session); }
    catch (err) { render(); toast(err.message, "error"); return; }
  }
  if (!getSession()) { render(); return; }
  $("#app").innerHTML = `<div class="empty" style="min-height:100vh;justify-content:center">${ic("loader", "ic-xl spin")}</div>`;
  try { await loadState(); }
  catch (err) { if (err.status !== 401) { render(); toast(err.message, "error"); } return; }
  render();
  if (paid) {
    toast("Paiement reçu, merci ! Activation de ton espace…", "info");
    // Le webhook Stripe peut arriver quelques secondes après la redirection.
    for (let i = 0; i < 10 && S.status !== "live"; i++) {
      await new Promise(ok => setTimeout(ok, 3000));
      try { await loadState(); } catch { break; }
    }
    if (S.status === "live") { go("performance"); toast("Ton site est en ligne. Bienvenue dans ton tableau de bord !"); }
  }
}
boot();
})();
</script>
