steps:
  # 1a. Build public corporate landing (Next static export -> landing-site/out/index.html)
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd landing-site && npm ci --silent && npm run build'
    id: build-landing

  # 1b. Build React cockpit into landing-site/out/app/
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd frontend && npm ci --silent && npm run build'
    id: build-frontend
    waitFor: ['build-landing']

  # 1c. Verify both public landing and React cockpit before Firebase deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        test -f landing-site/out/index.html
        test -f landing-site/out/app/index.html
        echo "Pulse-PME landing + Local Pulse cockpit ready for Firebase"
    id: verify-firebase-app
    waitFor: ['build-frontend']

  # 2. Build & push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'
      - '.'
    id: build-docker
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA']
    id: push-docker
    waitFor: ['build-docker']

  # 3. Deploy backend to Cloud Run
  # Secrets are optional: only secrets that actually exist in Secret Manager
  # are mounted. This prevents one missing enrichment key from breaking deploy.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SECRETS=""
        for SECRET in           GOOGLE_MAPS_API_KEY VERCEL_API_TOKEN           PAPPERS_API_KEY PERPLEXITY_API_KEY           GEMINI_API_KEY MISTRAL_API_KEY APIFY_TOKEN           FAL_KEY PEXELS_API_KEY ANTHROPIC_API_KEY           STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
        do
          if gcloud secrets describe "$$SECRET" --project="$PROJECT_ID" >/dev/null 2>&1; then
            if [ -n "$$SECRETS" ]; then SECRETS="$$SECRETS,"; fi
            SECRETS="$$SECRETS$$SECRET=$$SECRET:latest"
          fi
        done

        CMD="gcloud run deploy local-pulse-api           --image=gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA           --region=europe-west1           --platform=managed           --allow-unauthenticated           --memory=2Gi           --cpu=2           --timeout=300           --min-instances=1           --max-instances=1           --concurrency=80           --set-env-vars=APP_BUILD_SHA=$COMMIT_SHA,SCORING_ENGINE=opportunity_v1           --project=$PROJECT_ID           --quiet"

        if [ -n "$$SECRETS" ]; then
          CMD="$$CMD --update-secrets=$$SECRETS"
        fi

        echo "Deploying Local Pulse backend with available Secret Manager keys..."
        eval "$$CMD"
    id: deploy-backend
    waitFor: ['push-docker']

  # 4. Deploy frontend to Firebase Hosting
  # Use a Node image because firebase-tools is an npm package. The previous
  # cloud-sdk image did not provide npm and failed with exit status 127.
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npx -y firebase-tools@latest deploy --only hosting --project $PROJECT_ID --non-interactive
    id: deploy-frontend
    waitFor: ['verify-firebase-app']

images:
  - 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
