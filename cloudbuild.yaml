steps:
  # 1a. Build public corporate landing (Next static export -> landing-site/out/index.html)
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd landing-site && npm ci --silent && npm run build'
    id: build-landing

  # 1b. Build React cockpit into landing-site/out/app/
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd frontend && npm ci --silent && npm run build'
    id: build-frontend
    waitFor: ['build-landing']

  # 1c. Verify both public landing and React cockpit before Firebase deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        test -f landing-site/out/index.html
        test -f landing-site/out/app/index.html
        echo "Pulse-PME landing + Local Pulse cockpit ready for Firebase"
    id: verify-firebase-app
    waitFor: ['build-frontend']

  # 2. Build & push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'
      - '.'
    id: build-docker
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA']
    id: push-docker
    waitFor: ['build-docker']

  # 3. Deploy backend to Cloud Run
  # Secrets are read from Secret Manager and mounted with --set-secrets (never as
  # plain env vars). Only secrets that exist are mounted, so one missing optional
  # key does not break the deploy. Secrets are created by deploy.sh.
  # Note: $$ escapes a shell variable for Cloud Build; $PROJECT_ID / $COMMIT_SHA are substitutions.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SECRET_SPECS=()
        for SECRET in \
          GOOGLE_MAPS_API_KEY GOOGLE_API_KEY GEMINI_API_KEY MISTRAL_API_KEY \
          OPENAI_API_KEY ANTHROPIC_API_KEY PAPPERS_API_KEY PERPLEXITY_API_KEY \
          PEXELS_API_KEY APIFY_TOKEN VERCEL_API_TOKEN STRIPE_SECRET_KEY \
          STRIPE_WEBHOOK_SECRET DATABASE_URL ADMIN_API_TOKEN \
          SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD SMTP_FROM ALERT_EMAIL
        do
          if gcloud secrets describe "$$SECRET" --project="$PROJECT_ID" >/dev/null 2>&1; then
            SECRET_SPECS+=("$$SECRET=$$SECRET:latest")
          fi
        done
        # tools.py copies FAL_API_KEY into FAL_KEY and manager.py reads FAL_KEY: expose both.
        if gcloud secrets describe FAL_API_KEY --project="$PROJECT_ID" >/dev/null 2>&1; then
          SECRET_SPECS+=("FAL_API_KEY=FAL_API_KEY:latest" "FAL_KEY=FAL_API_KEY:latest")
        fi

        DEPLOY_ARGS=(
          run deploy local-pulse-api
          --image="gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA"
          --region=europe-west1
          --platform=managed
          --allow-unauthenticated
          --memory=2Gi
          --cpu=2
          --timeout=300
          --min-instances=1
          --max-instances=1
          --concurrency=80
          --set-env-vars="APP_BUILD_SHA=$COMMIT_SHA,SCORING_ENGINE=opportunity_v1"
          --project="$PROJECT_ID"
          --quiet
        )
        if [ $${#SECRET_SPECS[@]} -gt 0 ]; then
          DEPLOY_ARGS+=("--set-secrets=$$(IFS=,; echo "$${SECRET_SPECS[*]}")")
        fi

        echo "Deploying Local Pulse backend with $${#SECRET_SPECS[@]} secret binding(s)..."
        gcloud "$${DEPLOY_ARGS[@]}"
    id: deploy-backend
    waitFor: ['push-docker']

  # 4. Deploy frontend to Firebase Hosting
  # Use a Node image because firebase-tools is an npm package. The previous
  # cloud-sdk image did not provide npm and failed with exit status 127.
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npx -y firebase-tools@latest deploy --only hosting --project $PROJECT_ID --non-interactive
    id: deploy-frontend
    waitFor: ['verify-firebase-app']

images:
  - 'gcr.io/$PROJECT_ID/local-pulse-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
