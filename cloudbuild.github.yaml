steps:
  # 0. No-source mode: fetch the exact public GitHub commit directly.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        git init .
        git remote add origin https://github.com/mastonic/google-pme-agence.git
        git fetch --depth=1 origin "$_GIT_SHA"
        git checkout --detach FETCH_HEAD
    id: checkout-source

  # 1. Build the public Next.js landing into landing-site/out.
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd landing-site && npm ci --silent && npm run build'
    id: build-landing
    waitFor: ['checkout-source']

  # 2. Build the React cockpit directly into landing-site/out/app.
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cd frontend && npm ci --silent && npm run build'
    id: build-frontend
    waitFor: ['build-landing']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        test -f landing-site/out/index.html
        test -f landing-site/out/app/index.html
        echo "Landing + Local Pulse cockpit ready for Firebase"
    id: verify-firebase-output
    waitFor: ['build-frontend']

  # 3. Build & push backend image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:$_GIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'
      - '.'
    id: build-docker
    waitFor: ['checkout-source']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/local-pulse-api:$_GIT_SHA'
    id: push-docker
    waitFor: ['build-docker']

  # 4. Deploy backend. Optional secrets are mounted only when present.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SECRETS=""
        for SECRET in           GOOGLE_MAPS_API_KEY VERCEL_API_TOKEN           PAPPERS_API_KEY PERPLEXITY_API_KEY           GEMINI_API_KEY MISTRAL_API_KEY APIFY_TOKEN           FAL_KEY PEXELS_API_KEY ANTHROPIC_API_KEY
        do
          if gcloud secrets describe "$$SECRET" --project="$PROJECT_ID" >/dev/null 2>&1; then
            if [ -n "$$SECRETS" ]; then SECRETS="$$SECRETS,"; fi
            SECRETS="$$SECRETS$$SECRET=$$SECRET:latest"
          fi
        done

        CMD="gcloud run deploy local-pulse-api           --image=gcr.io/$PROJECT_ID/local-pulse-api:$_GIT_SHA           --region=europe-west1           --platform=managed           --allow-unauthenticated           --memory=2Gi           --cpu=2           --timeout=300           --min-instances=1           --max-instances=1           --concurrency=80           --set-env-vars=APP_BUILD_SHA=$_GIT_SHA,SCORING_ENGINE=opportunity_v1           --project=$PROJECT_ID           --quiet"

        if [ -n "$$SECRETS" ]; then
          CMD="$$CMD --update-secrets=$$SECRETS"
        fi

        echo "Deploying Local Pulse backend..."
        eval "$$CMD"
    id: deploy-backend
    waitFor: ['push-docker']

  # 5. Deploy static output to Firebase Hosting.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq nodejs npm
        npm install -g firebase-tools --silent
        firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
    id: deploy-frontend
    waitFor: ['verify-firebase-output']

images:
  - 'gcr.io/$PROJECT_ID/local-pulse-api:$_GIT_SHA'
  - 'gcr.io/$PROJECT_ID/local-pulse-api:latest'

substitutions:
  _GIT_SHA: 'main'

timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
