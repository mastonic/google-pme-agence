name: Local Pulse CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install landing dependencies
        working-directory: landing-site
        run: npm ci
      - name: Build public landing
        working-directory: landing-site
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build cockpit
        working-directory: frontend
        run: npm run build

      - name: Verify Firebase output
        run: |
          test -f landing-site/out/index.html
          test -f landing-site/out/app/index.html
