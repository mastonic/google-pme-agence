name: Deploy Local Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-pulse-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend + Firebase Hosting through Cloud Build
        run: |
          gcloud builds submit \
            --no-source \
            --config cloudbuild.github.yaml \
            --project pme-local-pulse \
            --substitutions=_GIT_SHA=${GITHUB_SHA}
