name: Deploy Local Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-pulse-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend-hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and validate all three sites
        working-directory: landing-site
        run: |
          npm ci
          bash scripts/build-sites.sh

      - name: Build Local Pulse cockpit
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Firebase output
        run: |
          test -f landing-site/out/index.html
          test -f landing-site/out/app/index.html
          test -f landing-site/out/espace/index.html
          test -f hosting-dist/info/info/index.html
          test -f hosting-dist/store/store/index.html

      - name: Deploy Firebase Hosting (info, store, then fr)
        run: |
          npm install -g firebase-tools
          firebase deploy --config firebase.multisite.json --only hosting --project pme-local-pulse --non-interactive
          firebase deploy --only hosting --project pme-local-pulse --non-interactive

  backend-cloudrun:
    name: Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run builds the Dockerfile with Cloud Build. No private GHCR image
      # or deletion of container packages is required.
      # Existing runtime environment variables and Secret Manager mappings are
      # preserved: do not pass --set-env-vars or --set-secrets here.
      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy local-pulse-api \
            --source . \
            --region europe-west1 \
            --project pme-local-pulse \
            --no-cpu-throttling \
            --quiet

      - name: Check backend health
        run: |
          URL="$(gcloud run services describe local-pulse-api --region europe-west1 --project pme-local-pulse --format='value(status.url)')"
          test -n "$URL"
          curl --fail --show-error --silent --max-time 30 "$URL/status" >/dev/null
