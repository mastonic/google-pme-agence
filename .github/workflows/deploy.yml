name: Deploy Local Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-pulse-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend-hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build landing
        working-directory: landing-site
        run: |
          npm ci
          npm run build

      - name: Build Local Pulse cockpit
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify Firebase output
        run: |
          test -f landing-site/out/index.html
          test -f landing-site/out/app/index.html

      - name: Deploy Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project pme-local-pulse --non-interactive

  backend-cloudrun:
    name: Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Remove previous private backend package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Previous versions may have been built before gha-creds-*.json was
          # excluded from Docker context. Remove the package before rebuilding.
          gh api --method DELETE /users/mastonic/packages/container/local-pulse-api || true

      - name: Build backend image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/mastonic/google-pme-agence \
            -t ghcr.io/mastonic/local-pulse-api:${GITHUB_SHA} \
            -t ghcr.io/mastonic/local-pulse-api:latest \
            .

      - name: Push backend image to GHCR
        run: |
          docker push ghcr.io/mastonic/local-pulse-api:${GITHUB_SHA}
          docker push ghcr.io/mastonic/local-pulse-api:latest

      - name: Backend image published privately
        run: |
          echo "::notice::Clean backend image pushed to GHCR. Cloud Run deployment is paused until the package is made public or Artifact Registry write access is granted."
