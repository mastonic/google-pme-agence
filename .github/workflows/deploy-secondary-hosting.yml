name: Deploy dedicated info and store hosting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-locale-secondary-hosting
  cancel-in-progress: false

jobs:
  deploy-secondary-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Install frontend dependencies
        working-directory: landing-site
        run: npm ci
      - name: Build info with correct canonical origin
        working-directory: landing-site
        env:
          NEXT_PUBLIC_SITE_URL: https://pulse-locale-pme.info
        run: |
          npm run build
          test -s out/info/index.html
          mkdir -p ../hosting-dist/info
          cp -a out/. ../hosting-dist/info/
      - name: Build store with correct canonical origin
        working-directory: landing-site
        env:
          NEXT_PUBLIC_SITE_URL: https://pulse-locale-pme.store
        run: |
          rm -rf .next out
          npm run build
          test -s out/store/index.html
          mkdir -p ../hosting-dist/store
          cp -a out/. ../hosting-dist/store/
      - name: Validate native Next.js routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("info", "store"):
              root = Path("hosting-dist") / name
              assert (root / "_next").is_dir()
              assert (root / name / "index.html").is_file()
              # Root is served via Firebase redirect, never with another route's HTML.
              (root / "index.html").unlink(missing_ok=True)
          PY
      - name: Deploy only secondary Firebase Hosting sites
        run: |
          npx --yes firebase-tools@latest deploy --config firebase.multisite.json --only hosting --project pme-local-pulse --non-interactive
