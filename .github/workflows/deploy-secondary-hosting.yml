name: Deploy dedicated info and store hosting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-locale-secondary-hosting
  cancel-in-progress: false

jobs:
  deploy-secondary-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PME_LOCAL_PULSE }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing-site/package-lock.json
      - name: Build static export
        working-directory: landing-site
        run: |
          npm ci
          npm run build
      - name: Prepare isolated site roots
        run: |
          set -euo pipefail
          test -s landing-site/out/info/index.html
          test -s landing-site/out/store/index.html
          mkdir -p hosting-dist/info hosting-dist/store
          cp -a landing-site/out/. hosting-dist/info/
          cp -a landing-site/out/. hosting-dist/store/
          cp landing-site/out/info/index.html hosting-dist/info/index.html
          cp landing-site/out/store/index.html hosting-dist/store/index.html
          test -s hosting-dist/info/index.html
          test -s hosting-dist/store/index.html
      - name: Deploy only secondary Firebase Hosting sites
        run: |
          npx --yes firebase-tools@latest deploy --config firebase.multisite.json --only hosting:pulse-locale-info,hosting:pulse-locale-store --project pme-local-pulse --non-interactive
